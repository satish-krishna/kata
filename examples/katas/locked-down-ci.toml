schema = 1
name = "locked-down-ci"
description = "A headless run for a machine whose managed settings forbid --dangerously-skip-permissions"
workdir = "."

task = """
Run the test suite, read the failures, and fix them.

<<Replace this with the job. Override the task at launch if you drive this from CI.>>

Everything you need is in the allow list below: reading and searching the repo,
running the project's own commands, and editing source. If you need something
outside it, say so in your final message rather than working around it — the
call will be denied and you will see why.
"""

[model]
id = "sonnet"

[leash]
max_turns = 40
timeout_secs = 3600
max_budget_usd = 5.0
isolation = "worktree"

# The point of this example. `bypass` (the default) passes
# --dangerously-skip-permissions, which claude rejects at startup on any machine
# whose managed settings set `permissions.disableBypassPermissionsMode`. `prompt`
# hands each check to Kata's own MCP tool instead, and the rules below answer it.
#
# `unmatched = "deny"` is the headless choice: nobody is watching, so the allow
# list is this run's complete tool surface and anything else is refused with a
# reason claude can read. (`unmatched = "ask"` would need [interactive] on.)
#
# Note this never *widens* anything: the prompt tool is the last step of claude's
# evaluation chain, so a call the machine's managed deny rules already block
# never reaches Kata at all.
[permissions]
mode = "prompt"
unmatched = "deny"
allow = [
  "Read",
  "Glob",
  "Grep",
  "Edit",
  "Write",
  "Bash(git status*)",
  "Bash(git diff*)",
  "Bash(git log*)",
  "Bash(cargo test*)",
  "Bash(cargo build*)",
  "Bash(cargo fmt*)",
  "Bash(cargo clippy*)",
]
# Evaluated before `allow`, so these hold even though `Edit` and `Write` are
# allowed above and `Bash(git *)` prefixes overlap.
deny = [
  "Bash(rm *)",
  "Bash(git push*)",
  "Bash(curl *)",
  "Edit(//etc/**)",
]
