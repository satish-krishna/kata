schema = 1
name = "permission-checkpoint"
description = "Drive all three prompt-mode outcomes past a live operator, in one short run"
workdir = "."

# A verification kata, not a working one. It exists to prove that
# `[permissions] mode = "prompt"` behaves against a real claude session, by
# making claude walk deliberately into each of the three outcomes in a fixed
# order so you can watch them land:
#
#   1. a call an `allow` rule matches   → decided silently, audit row only
#   2. a call no rule matches           → PAUSES on you (permission.requested)
#   3. a call a `deny` rule matches     → refused before it ever runs
#
# Nothing here writes, deletes, or reaches the network. Step 3 is a denied
# `git push --dry-run`, which the engine refuses *before* execution — so even
# if the deny rule were wrong, the command would be a no-op.
task = """
You are verifying Kata's permission plumbing. Run exactly the four steps below,
in order, one tool call each. Do not combine them, do not substitute equivalent
commands, and do not add steps.

1. Read the file `README.md` in the working directory. Report its first heading.
2. Run this Bash command, verbatim: `git status --short`
3. Run this Bash command, verbatim: `git log --oneline -5`
4. Run this Bash command, verbatim: `git push --dry-run origin HEAD`

Step 4 is expected to be refused. When it is, do NOT retry it, do not look for
another way to push, and do not treat it as a problem to solve — being refused
is the point of the exercise.

Then write a final message with one line per step, in this exact form:

    <step number> | <the tool call you made> | allowed | denied | asked
    …and for each, whether you were paused on a human before it ran.

The exact command strings matter. They are matched against this run's rules
character by character, anchored at the start, so `git log --oneline -5` and
`git --no-pager log --oneline -5` are not the same call and will not be
answered the same way.
"""

[identity]
mode = "append"
system_prompt = """
You are being used as a test fixture for a permission system. Follow the task's
steps literally. Never work around a refused tool call — a refusal is a result
to report, not an obstacle to route around.
"""

[model]
id = "sonnet"

# Short and cheap: this run does four tool calls and stops. isolation stays
# "none" on purpose — nothing here writes, and a worktree would make step 2's
# `git status` describe a scratch checkout rather than the repo you are looking
# at, which makes the run harder to follow, not safer.
[leash]
max_turns = 12
timeout_secs = 600
max_budget_usd = 1.0
isolation = "none"

# Required by `unmatched = "ask"` — validate rejects the pair otherwise, since
# nothing else could answer the prompt. answer_timeout_secs also gives you a
# fourth thing to verify: walk away from step 3's prompt and the run should end
# with exit 123 rather than hanging.
[interactive]
enabled = true
answer_timeout_secs = 300

[permissions]
mode = "prompt"

# The whole point. Every check claude would have put to a human comes back to
# the engine, which answers it from the rules below and emits a
# `permission.decided` event either way — so the stream is a complete audit
# trail, not just a record of the calls that stopped.
unmatched = "ask"

# Step 1 matches `Read` (a bare tool rule matches every call to that tool).
# Step 2 matches `Bash(git status*)`. Both are settled by rule: no pause, one
# `permission.decided` row each, `decided_by = "allow-rule"`.
#
# Step 3 (`git log …`) is deliberately absent from this list. Matching is
# anchored at the start of the command, so `Bash(git status*)` does not cover
# it — it falls through to `unmatched` and stops the run on you.
allow = [
  "Read",
  "Bash(git status*)",
]

# Evaluated before `allow`, and short-circuits — a denied call never reaches the
# unmatched policy, so it can never become a prompt. Step 4 lands here.
deny = [
  "Bash(git push*)",
  "Bash(rm *)",
]
