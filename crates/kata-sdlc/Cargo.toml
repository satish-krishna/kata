[package]
name = "kata-sdlc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kata-core = { path = "../kata-core" }
serde.workspace = true
serde_json.workspace = true
git2.workspace = true
libgit2-sys = "0.18"
ureq.workspace = true
tempfile.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { version = "10", optional = true, default-features = false, features = ["serde-compat"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serial_test = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials"] }
