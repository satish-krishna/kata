[package]
name = "kata-sdlc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kata-core = { path = "../kata-core" }
serde.workspace = true
serde_json.workspace = true
git2.workspace = true
libgit2-sys = "0.18"
tempfile.workspace = true
toml.workspace = true
thiserror.workspace = true
process-wrap = { version = "9.1", features = ["std", "job-object", "process-group", "creation-flags"] }
ts-rs = { version = "10", optional = true, default-features = false, features = ["serde-compat"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serial_test = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }
