<section class="k-card k-card--pad grid gap-3" aria-labelledby="pr-card-title">
  <h2 id="pr-card-title" class="k-card__title">Pull requests</h2>
  <ul class="k-left__list">
    @for (row of rows(); track row.repo) {
      <li class="k-left__row">
        <span class="k-mono">{{ row.repo }}</span>
        @if (row.number !== null) {
          <span class="k-mono">#{{ row.number }}</span>
        }
        <a [href]="row.url" target="_blank" rel="noopener noreferrer">View on GitHub</a>
      </li>
    }
  </ul>
</section>
