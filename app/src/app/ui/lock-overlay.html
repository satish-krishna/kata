<hlm-dialog [state]="view() ? 'open' : 'closed'" [disableClose]="true">
  <hlm-dialog-content *hlmDialogPortal="let ctx">
    @if (view(); as v) {
      <h2 hlmDialogTitle class="sr-only">{{ v.title }}</h2>
      <app-lock-panel
        [view]="v"
        [elapsed]="elapsed()"
        [stepProgress]="stepProgress()"
        (cancel)="cancel.emit()"
      />
    }
  </hlm-dialog-content>
</hlm-dialog>
