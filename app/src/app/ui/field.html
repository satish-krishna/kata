<div class="k-field">
  <div class="k-field__label">
    {{ label() }}
    @if (key()) {
      <code>{{ key() }}</code>
    }
  </div>
  <ng-content />
  @if (hint()) {
    <div class="k-field__hint" [class.k-field__hint--error]="error()" [attr.id]="hintId() ?? null" [attr.aria-live]="live() ? 'polite' : null">{{ hint() }}</div>
  }
</div>
