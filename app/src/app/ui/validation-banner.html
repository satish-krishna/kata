@if (errors().length > 0) {
  <hlm-alert variant="destructive" class="wb-banner wb-banner--error">
    <ng-icon name="lucideTriangleAlert" size="15" />
    <div hlmAlertDescription class="wb-banner__list">
      @for (e of errors(); track $index) {
        <span>{{ e }}</span>
      }
    </div>
  </hlm-alert>
}
