<ul class="k-repos" aria-label="Repositories">
  @for (r of rows(); track r.name) {
    <li>
      <button
        hlmBtn
        variant="bare"
        size="bare"
        type="button"
        class="k-repos__row"
        [attr.aria-current]="r.name === selected() ? 'true' : null"
        (click)="select.emit(r.name)"
      >
        <span class="k-mono k-repos__name">{{ r.name }}</span>
        <span [class]="'k-status k-status--' + r.tone"><span class="k-status__dot"></span>{{ r.label }}</span>
        @if (r.clock) {
          <span class="k-mono k-repos__clock">{{ r.clock }}</span>
        }
        @if (r.paused) {
          <span class="k-mono k-repos__paused">{{ r.paused }}</span>
        }
      </button>
    </li>
  }
</ul>
