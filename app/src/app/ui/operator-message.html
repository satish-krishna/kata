<div class="k-event k-event--operator">
  <span class="k-event__gutter">you</span>
  <span class="k-event__body">{{ record().text }}</span>
  @if (readAt(); as read) {
    <span class="k-badge k-badge--success" data-message-state="read"><span class="k-status k-status--success"><span class="k-status__dot"></span>read {{ read }}</span></span>
  } @else {
    <span class="k-badge k-badge--warning" data-message-state="waiting"><span class="k-status k-status--warning"><span class="k-status__dot"></span>waiting · sent {{ sentAt() }}</span></span>
  }
</div>
