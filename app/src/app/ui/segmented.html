<hlm-toggle-group
  type="single"
  role="radiogroup"
  [attr.aria-label]="ariaLabel() ?? null"
  [value]="value()"
  (valueChange)="pick($event)"
>
  @for (opt of options(); track opt.value) {
    <button
      hlmToggleGroupItem
      role="radio"
      [attr.aria-checked]="opt.value === value()"
      [value]="opt.value"
      [disabled]="opt.disabled ?? false"
      [attr.title]="opt.title ?? null"
    >
      {{ opt.label }}
      @if (opt.mark; as mark) {
        <span class="k-seg-mark">{{ mark }}</span>
      }
    </button>
  }
</hlm-toggle-group>
