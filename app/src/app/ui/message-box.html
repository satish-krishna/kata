<div class="flex items-center gap-2">
  <input
    hlmInput
    class="min-w-0 flex-1"
    placeholder="Message the agent"
    aria-label="Message the agent"
    data-message-input
    [value]="text()"
    [disabled]="!view().enabled"
    (input)="onInput($event)"
    (keydown.enter)="submit()"
  />
  <button hlmBtn size="sm" type="button" data-message-send [disabled]="!canSend()" (click)="submit()">Send</button>
</div>
<p class="mt-2 text-(--text-faint) [font:var(--font-code-sm)]" role="status" data-message-note>{{ view().note }}</p>
