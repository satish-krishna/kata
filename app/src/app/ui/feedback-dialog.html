<hlm-dialog [state]="open() ? 'open' : 'closed'" (stateChanged)="onState($event)">
  <hlm-dialog-content *hlmDialogPortal="let ctx">
    <div hlmDialogTitle>{{ action() }}</div>
    <div class="k-form">
      <app-field
        label="What should change?"
        [hint]="hint()"
        [error]="refused()"
        hintId="feedback-hint"
        [live]="true"
      >
        <textarea
          #box
          hlmTextarea
          rows="6"
          aria-label="What should change?"
          [forceInvalid]="refused()"
          [attr.aria-invalid]="refused() ? 'true' : null"
          aria-describedby="feedback-hint"
          [value]="text()"
          (input)="onText($event)"
        ></textarea>
      </app-field>
    </div>
    <hlm-dialog-footer>
      <button hlmBtn variant="ghost" size="sm" type="button" (click)="cancel.emit()">Cancel</button>
      <button hlmBtn variant="primary" size="sm" type="button" (click)="onRun()">Run</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
