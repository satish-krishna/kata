<section class="k-findings" aria-labelledby="findings-title">
  <h2 id="findings-title" class="k-left__head">Review findings</h2>
  @if (findings().length === 0) {
    <p class="k-state__body">The review found nothing.</p>
  } @else {
    <ng-container *ngTemplateOutlet="list; context: { $implicit: findings() }" />
  }
  @for (r of replaced(); track $index) {
    <details class="k-findings__replaced">
      <summary>Replaced by the review at {{ r.at }}</summary>
      <ng-container *ngTemplateOutlet="list; context: { $implicit: r.findings }" />
    </details>
  }
</section>
<ng-template #list let-items>
  <ol class="k-findings__list">
    @for (f of items; track $index) {
      <li class="k-findings__item">
        <span [class]="'k-status k-status--' + tone(f)"><span class="k-status__dot"></span>{{ label(f) }}</span>
        <span class="k-findings__text">{{ f.text }}</span>
      </li>
    }
  </ol>
</ng-template>
