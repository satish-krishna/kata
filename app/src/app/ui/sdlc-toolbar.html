<header class="wb-toolbar">
  <div class="wb-brand">
    <span class="wb-seal">型</span>
  </div>
  <button
    hlmBtn
    variant="bare"
    size="bare"
    class="k-modebadge"
    type="button"
    title="Switch mode"
    aria-label="Switch mode (ai-sdlc)"
    [disabled]="locked()"
    (click)="switchMode.emit()"
  >ai-sdlc</button>
  <div class="wb-sep"></div>
  @if (!blocked()) {
    <app-workspace-switcher
      [workspaces]="workspaces()"
      [current]="current()"
      [missing]="missing()"
      [counts]="counts()"
      [locked]="locked()"
      (select)="select.emit($event)"
      (add)="add.emit()"
      (remove)="remove.emit()"
    />
  }
  <nav class="k-crumbs" aria-label="Breadcrumb">
    @if (back(); as label) {
      <button
        hlmBtn
        variant="bare"
        size="bare"
        class="k-crumbs__back"
        type="button"
        aria-label="Back to the changes list"
        [disabled]="locked()"
        (click)="goBack.emit()"
      >{{ label }}</button>
    }
    @for (crumb of crumbs(); track $index) {
      <span class="k-crumbs__sep" aria-hidden="true"><ng-icon name="lucideChevronRight" size="14" /></span>
      <span class="k-crumbs__item" [attr.title]="crumb">{{ crumb }}</span>
    }
  </nav>
  @if (!blocked() && branch(); as b) {
    <span class="k-branch" data-testid="branch" role="note" [attr.title]="branchLabel()" [attr.aria-label]="branchLabel()">
      <span class="k-branch__icon" aria-hidden="true"><ng-icon name="lucideGitBranch" size="14" /></span>
      <span class="k-branch__text">{{ b }}</span>
    </span>
  }
  <ng-content select="[toolbarStages]" />
  <div class="wb-toolbar__spacer"></div>
  <ng-content select="[toolbarLinks]" />
  <button
    hlmBtn
    variant="bare"
    size="bare"
    class="k-iconbtn"
    type="button"
    title="Settings"
    aria-label="AI-SDLC settings"
    [disabled]="locked()"
    (click)="openSettings.emit()"
  >
    <ng-icon name="lucideSettings" size="16" />
  </button>
  <div class="wb-sep"></div>
  <ng-content />
</header>
